name: QA (linters, typecheckers & formatters)

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  typecheck_python:
    name: ty (Typecheck)
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Sync uv
        run: |
          uv sync --all-groups --all-extras

      - name: Run ty
        run: |
          uv run ty check ./src

  ruff_check:
    name: ruff check (lint)
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v5

      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
          src: "./src"

  ruff_format:
    name: ruff format (formatting)
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v5

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"
          src: "./src"
