name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group demo --group test

      - name: Run smoke tests
        run: uv run pytest tests/test_smoke.py -v -m "not e2e"

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group demo --group test

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: uv run pytest tests/test_e2e.py -v --browser chromium --tracing retain-on-failure

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
