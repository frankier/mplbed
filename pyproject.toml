[project]
name = "mplbed"
version = "0.1.1"
description = "Integrate Matplotlib's WebAgg backend with Starlette for real-time plotting in web applications."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "frozendict>=2.4.7",
    "matplotlib>=3.10.9",
    "starlette>=1.0.0",
    "tornado>=6.5.5",
]

[dependency-groups]
demo = [
  "mne>=1.12.1",
  "quart",
  "django",
  "daphne",
  "questionary"
]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "sphinx-autodoc-typehints>=2",
    "furo>=2024",
    "quart",
    "django",
    "daphne",
]
test = [
    "pytest>=8",
    "pytest-playwright>=0.5",
    "pillow>=10",
]
qa = [
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end Playwright tests that drive a real browser",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pyupgrade
    "UP",
    # pydocstyle
    "D",
]

ignore = [
    # Package/module-level docstrings
    "D100",
    "D104",
    # Summary line seprate from body
    "D205"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = ["mplbed._doc_helpers.doc", "mplbed.integration._common.setup_page_docstring"]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"
