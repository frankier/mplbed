[project]
name = "mplbed"
version = "0.1.0"
description = "Integrate Matplotlib's WebAgg backend with Starlette for real-time plotting in web applications."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "starlette>=1.0.0",
    "tornado>=6.5.5",
]

[dependency-groups]
demo = [
  "mne>=1.12.1",
  "quart",
  "django",
  "daphne",
  "questionary"
]
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "sphinx-autodoc-typehints>=2",
    "furo>=2024",
    "quart",
]

[build-system]
requires = ["uv_build >= 0.11.7, <0.12.0"]
build-backend = "uv_build"
